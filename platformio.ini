; PlatformIO Project Configuration File
;
; Board:  Elecrow CrowPanel Advanced 7" ESP32-P4 HMI Display (1024x600, MIPI-DSI, GT911 touch)
; Repo:   https://github.com/Elecrow-RD/CrowPanel-Advanced-7inch-ESP32-P4-HMI-AI-Display-1024x600-IPS-Touch-Screen
;
; ESP32-P4 support in Arduino is new enough that the official PlatformIO
; espressif32 platform lags behind; pioarduino's fork tracks it. Display/touch
; bring-up uses Espressif's ESP32_Display_Panel stack (MIPI-DSI + EK79007 LCD
; + GT911 touch), pinned to the same versions the vendor's Arduino examples use.

[platformio]
; esp-hosted (for WiFi over the companion C6 chip) invokes ESP-IDF's
; component/Kconfig tooling, which errors out on whitespace in its build
; paths - and this project's own folder name has spaces in it ("Elecrow
; ESP32-P4 HMI Display"). Redirect just the build workspace to a space-free
; path instead of renaming the project folder.
workspace_dir = ~/.pio-builds/elecrow-esp32-p4-hmi-display

[env:elecrow_esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; This board's silicon is chip revision v1.3, an engineering-sample (ES) unit
; predating rev.300 mass production. The "esp32-p4_r3" board target builds a
; bootloader for the rev.300 chip variant, which crashes with an illegal
; instruction at the bootloader entry point on this ES silicon. "esp32-p4"
; targets the ES variant instead; its default flash_size is overridden below
; since this board actually has 16MB of flash.
board = esp32-p4
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; The ESP32-P4 has no WiFi radio of its own; this board pairs it with a
; companion ESP32-C6 over a 1-bit SDIO link, using ESP-IDF's esp-hosted
; transport (CONFIG_ESP_WIFI_REMOTE_ENABLED makes Arduino's normal WiFi.h
; API transparently proxy over that link instead of needing a different
; API). Pin values are from the community reference project's
; crowpanel-p4-70-90-101 env (github.com/mverch67/crowpanel-advanced-p4-c6-upgrade),
; which targets this exact 7"/9"/10.1" board family - unverified against this
; specific unit yet, being tested here.
extra_scripts = pre:fix_p4_linker.py
; ESP-IDF's RISC-V newlib memcpy has a hard #error under -Os (an errata
; guard, DIG-694) that isn't actually scoped to esp32p4 (only c2/c3/c6/h2/
; h21 are documented as affected elsewhere in ESP-IDF). This framework build
; forces -Os for that file regardless of CONFIG_COMPILER_OPTIMIZATION_*, so
; the guard was patched directly in the installed framework package
; (~/.platformio/packages/framework-espidf/components/newlib/src/port/riscv/memcpy.c)
; to skip on P4 rather than worked around here.
custom_sdkconfig =
    CONFIG_ESP_HOSTED_ENABLED=y
    CONFIG_ESP_WIFI_REMOTE_ENABLED=y
    CONFIG_ESP_HOSTED_P4_DEV_BOARD_NONE=y
    CONFIG_ESP_HOSTED_IDF_SLAVE_TARGET="esp32c6"
    CONFIG_ESP_HOSTED_CP_TARGET_ESP32C6=y
    CONFIG_ESP_HOSTED_CP_TARGET_ESP32H2=n
    CONFIG_ESP_HOSTED_PRIV_SDIO_OPTION=y
    CONFIG_ESP_HOSTED_SPI_HOST_INTERFACE=n
    CONFIG_ESP_HOSTED_SDIO_HOST_INTERFACE=y
    CONFIG_ESP_HOSTED_TRANSPORT_SDIO=y
    CONFIG_ESP_HOSTED_SDIO_SLOT_1=y
    CONFIG_ESP_HOSTED_SDIO_1_BIT_BUS=y
    CONFIG_ESP_HOSTED_SDIO_BUS_WIDTH=1
    CONFIG_ESP_HOSTED_SDIO_CLOCK_FREQ_KHZ=10000
    CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_CLK_SLOT_1=18
    CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_CMD_SLOT_1=19
    CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D0_SLOT_1=14
    CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D1_1BIT_BUS_SLOT_1=15
    CONFIG_ESP_HOSTED_SDIO_RESET_ACTIVE_HIGH=y
    CONFIG_ESP_HOSTED_SDIO_GPIO_RESET_SLAVE=32
    CONFIG_ESP_HOSTED_GPIO_SLAVE_RESET_SLAVE=32
    CONFIG_ESP_HOSTED_SDIO_RESET_DELAY_MS=1500
    CONFIG_ESP_HOSTED_SLAVE_RESET_ON_EVERY_HOST_BOOTUP=y
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    lvgl/lvgl @ 8.3.11
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
upload_port = /dev/cu.wchusbserial210
monitor_port = /dev/cu.wchusbserial210
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
; lv_conf_internal.h unconditionally includes lv_conf_kconfig.h (LVGL's
; ESP-IDF Kconfig auto-detection, which pulls in sdkconfig.h/esp_attr.h)
; unless this is defined. This project configures LVGL via its own
; include/lv_conf.h instead, and the Kconfig path isn't reachable anyway:
; PlatformIO's library dependency finder builds lvgl in an environment that
; doesn't inherit the framework's ESP-IDF component include paths.
    -DLV_KCONFIG_IGNORE
    -Iinclude
    -O2
; The RISC-V toolchain rejects -mlongcalls (an Xtensa-only flag); PlatformIO's
; library dependency finder adds it anyway for third-party libs like lvgl.
build_unflags =
    -mlongcalls
